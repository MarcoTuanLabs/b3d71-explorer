<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" href="data:,"/>
<title>B3D71 · Neuron & Population Explorer</title>
<style>
  :root{
    --sb:#151a26; --sb2:#1d2434; --sbln:#2a3550; --sbtx:#aeb8cc; --sbmut:#6b7690;
    --ink:#1c2430; --mut:#5f6b7d; --line:#dbe1e9; --bg:#f1f3f6; --card:#fff;
    --acc:#3569b8; --acc2:#294f8d;
    --M2:#3f7fbf; --M1:#4a9d5b; --S1:#c0504d;
    --broad:#4C72B0; --fast:#C15B7A;
    --exc:#DD8452; --sup:#8172B3; --unm:#9aa4b3;
    --succ:#3C7DB0; --fail:#C0504D;
    --shadow:0 1px 2px rgba(20,30,55,.045),0 5px 16px rgba(25,35,60,.04);
    --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c4ccd8;border-radius:6px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#a9b3c2;background-clip:content-box}
  #side ::-webkit-scrollbar-thumb{background:#38435d;background-clip:content-box}

  #side{width:240px;flex:0 0 240px;background:#151a26;color:var(--sbtx);display:flex;flex-direction:column;height:100%;border-right:1px solid #0b0e14}
  .brand{padding:16px 16px 13px;border-bottom:1px solid var(--sbln);display:flex;gap:10px;align-items:center}
  .brand .logo{width:32px;height:32px;border-radius:7px;background:#4d69ad;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex:0 0 32px;letter-spacing:0}
  .brand b{color:#fff;font-size:13.5px;display:block;line-height:1.25}
  .brand span{color:#7c88a2;font-size:10.5px}
  .sbscroll{overflow-y:auto;flex:1;padding-bottom:10px}
  .sec{padding:15px 18px 6px;font-size:9.5px;letter-spacing:.14em;color:#67728d;text-transform:uppercase;font-weight:600}
  .sec .pend{color:#c88f2e}

  #find{margin:6px 14px 2px;position:relative}
  #find input{width:100%;min-height:36px;background:var(--sb2);border:1px solid var(--sbln);color:#eaf0fb;border-radius:6px;padding:8px 11px 8px 32px;font-size:12.5px;outline:none;transition:.15s}
  #find input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(69,119,201,.2)}
  #find input::placeholder{color:#707c96}
  #find .ico{position:absolute;left:10px;top:9px;opacity:.55}
  #sug{position:absolute;left:0;right:0;top:41px;background:#1b2233;border:1px solid var(--sbln);border-radius:9px;margin-top:4px;z-index:30;overflow:hidden;display:none;box-shadow:0 14px 34px rgba(0,0,0,.45)}
  #sug div{padding:8px 11px;cursor:pointer;font-size:12px;color:#cfd7e6;display:flex;justify-content:space-between;gap:8px}
  #sug div small{color:#7c88a2}
  #sug div.hi,#sug div:hover{background:var(--acc);color:#fff}
  #sug div.hi small{color:#dbe6ff}

  nav a{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 9px;border-radius:6px;color:#b6bfd2;cursor:pointer;font-size:12.4px;user-select:none;transition:.13s}
  nav a:hover{background:var(--sb2);color:#e8edf7}
  nav a.active{background:#3569b8;color:#fff;font-weight:650;box-shadow:0 2px 9px rgba(29,67,126,.35)}
  nav a .ic{width:17px;text-align:center;flex:0 0 17px;opacity:.9;font-size:13px}
  nav a .warn{margin-left:auto;font-size:10px;color:#e0a23c}

  .filt{padding:2px 14px 8px}
  .filt label{display:block;font-size:9px;letter-spacing:.12em;color:#67728d;text-transform:uppercase;margin:12px 0 5px;font-weight:600}
  .filt select{width:100%;background:var(--sb2);border:1px solid var(--sbln);color:#eaf0fb;border-radius:6px;padding:8px 10px;font-size:12.5px;outline:none;cursor:pointer}
  .filt select:focus{border-color:var(--acc)}

  .selpill{margin:10px 14px 4px;background:var(--sb2);border:1px solid var(--sbln);border-radius:7px;padding:10px 12px;display:none}
  .selpill.on{display:block}
  .selpill .t{font-size:10.5px;color:#7c88a2;margin-bottom:3px;letter-spacing:.04em}
  .selpill .u{font-size:15px;color:#fff;font-weight:700;display:flex;align-items:center;gap:8px}
  .selpill .m{font-size:11px;color:#9aa6bd;margin-top:2px}
  .selpill button{margin-top:9px;width:100%;background:var(--acc);border:0;color:#fff;border-radius:6px;padding:7px;cursor:pointer;font-size:12px;font-weight:600}
  .selpill button:hover{background:#5885d6}
  .foot{padding:11px 16px;border-top:1px solid var(--sbln);font-size:10px;color:#5f6a84}

  #main{flex:1;overflow:auto;padding:24px 28px 64px}
  .page{animation:fade .18s ease;max-width:1260px;margin:0 auto}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .head h1{font-size:20px;margin:0;font-weight:720;letter-spacing:0;color:var(--ink)}
  .head .sub{color:var(--mut);font-size:12px}
  .crumb{color:var(--acc2);cursor:pointer;font-size:12px;margin-bottom:12px;display:inline-flex;gap:5px;align-items:center;font-weight:500}
  .crumb:hover{color:var(--acc)}

  .card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 4px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:#445064;font-weight:720}
  .card .desc{color:var(--mut);font-size:11.5px;margin:0 0 12px}
  .card .cap{color:var(--mut);font-size:11px;line-height:1.55;margin-top:9px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow)}
  .tile .l{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .tile .n{font-size:25px;font-weight:750;margin-top:6px;letter-spacing:-.02em}
  .tile .d{color:var(--mut);font-size:10.5px;margin-top:3px}

  .grid2{display:grid;grid-template-columns:325px 1fr;gap:15px;align-items:start}
  .grid2b{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:start}
  @media(max-width:1000px){.grid2,.grid2b{grid-template-columns:1fr}}
  .colcards{display:grid;gap:15px}

  .kv{display:grid;grid-template-columns:108px 1fr;row-gap:9px;font-size:13px}
  .kv .k{color:var(--mut)} .kv .v{font-weight:650}
  .chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}
  .badge{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap}

  table{border-collapse:collapse;width:100%;font-size:12.6px}
  th,td{text-align:right;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child,.l{text-align:left!important}
  th{position:sticky;top:0;background:#f6f8fb;cursor:pointer;user-select:none;font-weight:650;color:#4c586c;z-index:2;font-size:11.4px}
  th:hover,th.sorted{color:var(--acc)}
  tbody tr{cursor:pointer;transition:background .1s}
  tbody tr:hover{background:#eef4fd}
  tbody tr.sel{background:#e0ecfd;box-shadow:inset 3px 0 0 var(--acc)}
  .tablewrap{max-height:calc(100vh - 210px);overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow)}

  .legend{display:flex;gap:15px;align-items:center;font-size:12px;color:#46516a;margin:0 0 12px;flex-wrap:wrap}
  .legend b{cursor:default;display:inline-flex;align-items:center;gap:6px;font-weight:500}
  .legend b.tog{cursor:pointer;padding:3px 8px;border-radius:7px}
  .legend b.tog:hover{background:#f0f3f8}
  .legend b.off{opacity:.32}
  .legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
  .muted{color:var(--mut)}

  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:13px}
  .cgrid .card{margin:0;padding:11px 13px;cursor:pointer;transition:.14s}
  .cgrid .card:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 9px 24px rgba(30,50,90,.14)}
  .pager{display:flex;gap:10px;align-items:center;margin:0 0 14px}
  .btn{min-height:34px;background:#fff;border:1px solid #cfd6e0;border-radius:6px;padding:7px 13px;cursor:pointer;font-size:12px;font-weight:600;transition:.13s}
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .btn:disabled{opacity:.4;cursor:default}
  .seg{display:inline-flex;background:#eef1f6;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
  .seg button{border:0;background:transparent;padding:6px 13px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;color:#526076;transition:.12s}
  .seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  select.inline,input.inline{min-height:35px;border:1px solid #cfd6e0;border-radius:6px;padding:6px 10px;font-size:12px;background:#fff;color:var(--ink)}
  select.inline{cursor:pointer}
  .ctrls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
  .ctrls label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-right:4px}

  .verbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
  .verbadge{font-size:12px;font-weight:700;padding:6px 12px;border-radius:6px;color:#fff;display:inline-flex;align-items:center;gap:8px}
  .verbadge small{font-weight:500;opacity:.85;font-family:var(--mono);font-size:10.5px}
  .vwarn{font-size:11.5px;color:#9a6a1a;display:flex;gap:7px;align-items:center}

  .lockbanner{background:#fff8e9;border:1px solid #ebce9b;border-radius:8px;padding:10px 14px;margin-bottom:14px;color:#77531a;font-size:12px;display:flex;gap:9px;align-items:center}

  svg text:not([fill]){fill:#66718a;font-family:inherit}
  .axis{stroke:#c9d0db;stroke-width:1}
  .gl{stroke:#eef1f6;stroke-width:1}
  .cue{stroke:var(--acc);stroke-width:1.2;stroke-dasharray:4 3}
  #tip{position:fixed;pointer-events:none;z-index:999;background:rgba(24,31,45,.97);color:#eaf0fb;font-size:11.5px;padding:7px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;max-width:250px;line-height:1.5}
  #tip b{color:#fff}
  .swrap{max-width:100%;overflow-x:auto}
  .note{font-size:11.5px;color:var(--mut);background:#f5f7fa;border-radius:9px;padding:9px 12px;border:1px solid var(--line)}

  .latent-toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:0 0 16px;padding:0 0 13px;border-bottom:1px solid var(--line)}
  .latent-toolbar .field{display:grid;gap:4px;min-width:105px}
  .latent-toolbar .field.wide{min-width:175px}
  .latent-toolbar .field.dataset-field{min-width:280px}
  .latent-toolbar label{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .latent-toolbar select{width:100%}
  .latent-summary{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:-3px 0 14px;color:var(--mut);font-size:11.5px}
  .latent-summary b{color:var(--ink);font-weight:700}
  .latent-stage{display:grid;grid-template-columns:minmax(280px,.78fr) minmax(480px,1.35fr);gap:20px;align-items:start;margin:0 0 18px}
  .latent-stage.neural-only{grid-template-columns:minmax(0,1fr)}
  .latent-pane{min-width:0}
  .latent-pane-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 7px}
  .latent-pane-head h3{margin:0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#4e596d}
  .latent-pane-head span{color:var(--mut);font-size:10.5px;text-align:right}
  .paw-stage{background:#fff;min-height:390px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .manifold3d{position:relative;width:100%;aspect-ratio:4/3;min-height:430px;background:#fff;overflow:hidden;touch-action:none}
  .manifold3d canvas{display:block;width:100%;height:100%;cursor:grab;outline:none}
  .manifold3d canvas:active{cursor:grabbing}
  .manifold-status{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:12px;pointer-events:none}
  .manifold-axis{position:absolute;left:12px;bottom:10px;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.9);border:1px solid rgba(37,50,70,.13);padding:5px 7px;color:#657187;font:10.5px var(--mono);pointer-events:none}
  .manifold-axis b{font-weight:700;color:var(--ink)}
  .manifold-reset{position:absolute;right:10px;top:10px;width:34px;height:34px;padding:0;border-radius:8px;background:rgba(255,255,255,.94);border-color:rgba(37,50,70,.16);color:var(--ink);font-size:18px;line-height:1}
  .latent-key{display:flex;justify-content:flex-end;min-height:40px;margin-top:5px}
  .latent-provenance{font-size:10.5px;color:var(--mut);margin:-8px 0 16px}
  .basis-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;background:#e7edf7;color:#334c76;font-size:10.5px;font-weight:700}
  .analysis-toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:0 0 14px;padding:0 0 13px;border-bottom:1px solid var(--line)}
  .analysis-toolbar .field{display:grid;gap:4px;min-width:132px}
  .analysis-toolbar .field.wide{min-width:185px}
  .analysis-toolbar .field>*{min-width:0;max-width:100%}
  .analysis-toolbar select,.analysis-toolbar input{width:100%}
  .analysis-toolbar label{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .analysis-summary{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin:-2px 0 15px;color:var(--mut);font-size:11.5px}
  .analysis-summary b{color:var(--ink)}
  .analysis-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.72fr);gap:16px;align-items:start}
  .analysis-grid.equal{grid-template-columns:1fr 1fr}
  .chart-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:9px}
  .chart-title h3{margin:0;line-height:1.35}
  .chart-title span{color:var(--mut);font-size:10.5px;line-height:1.4;text-align:right}
  .phase-profile{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0 5px}
  .phase-profile .phase{min-width:0;border-top:4px solid var(--phase);padding:7px 4px 0;text-align:center}
  .phase-profile .phase b{display:block;font-size:14px;color:var(--ink)}
  .phase-profile .phase span{display:block;color:var(--mut);font-size:9.5px;overflow-wrap:anywhere}
  .unit-heading{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
  .unit-heading strong{font-size:18px}
  .metric-list{display:grid;grid-template-columns:1fr auto;gap:7px 12px;padding:3px 0;font-size:12px}
  .metric-list span:nth-child(odd){color:var(--mut)}
  .metric-list b{text-align:right}
  .phase-key{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin:8px 0 0;color:#4d586c;font-size:11px}
  .phase-key span{display:inline-flex;align-items:center;gap:6px}
  .phase-key i{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--phase)}
  .shape-key{font-size:11px;color:var(--mut);margin:7px 0 0}
  .source-note{font-size:10.5px;color:var(--mut);margin-top:10px}
  .weight-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(310px,.8fr);gap:15px;align-items:start}
  .factor-rank{display:grid;gap:6px;margin-top:8px}
  .factor-row{display:grid;grid-template-columns:34px minmax(0,1fr) 58px;gap:8px;align-items:center;font-size:11px}
  .factor-row .track{height:8px;background:#edf0f5;position:relative;overflow:hidden;border-radius:2px}
  .factor-row .fill{position:absolute;inset:0 auto 0 0;background:var(--factor);width:var(--width)}
  .factor-row b{text-align:right;font-family:var(--mono);font-size:10px}
  .bridge-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:21px 1px 10px}
  .bridge-head h2{margin:0;font-size:15px;letter-spacing:0;font-weight:700}
  .bridge-head span{color:var(--mut);font-size:11px;text-align:right}
  .matrix-key{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px;color:var(--mut);font-size:10.5px}
  .matrix-key .ramp{width:132px;height:9px;border:1px solid #dfe4eb;background:linear-gradient(90deg,#0a50ff,#00bde6,#f7f8fb,#ff4691,#e6003c)}
  .matrix-key b{color:var(--ink);font-family:var(--mono);font-size:10px}
  .caution-banner{background:#fff9ec;border:1px solid #ecd29b;border-radius:8px;color:#77551c;padding:10px 13px;margin-bottom:14px;font-size:11.5px}
  .page-intro{max-width:920px;color:var(--mut);font-size:12.5px;line-height:1.55;margin:-6px 0 16px}
  .summary-strip{display:flex;gap:9px 18px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin:0 0 14px;box-shadow:var(--shadow)}
  .summary-strip span{font-size:11.5px;color:var(--mut)}
  .summary-strip b{color:var(--ink)}
  .report-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:16px;align-items:start}
  .report-grid.equal{grid-template-columns:1fr 1fr}
  .report-grid.thirds{grid-template-columns:repeat(3,minmax(0,1fr))}
  .section-kicker{margin:23px 0 11px;padding:0 1px 7px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .section-kicker h2{margin:0;font-size:15px;letter-spacing:0;color:#303a49}
  .section-kicker span{font-size:11px;color:var(--mut);text-align:right}
  .evidence-note{border-left:3px solid var(--acc);background:#f6f8fb;padding:9px 12px;color:#536078;font-size:11.5px;margin:0 0 15px}
  .evidence-note.warn{border-left-color:#d79a32;background:#fff9ee;color:#77551c}
  .empty-state{min-height:180px;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:12px;background:#f7f9fb;border:1px dashed #d9dfe8;padding:18px}
  .factor-table{max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:6px}
  .factor-table table{font-size:11.5px}
  .factor-table th,.factor-table td{padding:7px 9px}
  .rank-list{display:grid;gap:7px;margin-top:7px}
  .rank-line{display:grid;grid-template-columns:68px minmax(0,1fr) 82px;gap:9px;align-items:center;font-size:11px;cursor:pointer}
  .rank-line .bar{height:13px;background:#edf0f5;position:relative}
  .rank-line .bar i{position:absolute;top:0;bottom:0;background:var(--bar);width:var(--width)}
  .rank-line b{text-align:right;font-family:var(--mono);font-size:10px}
  .metric-callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:0 0 12px}
  .metric-callout{border-top:3px solid var(--metric-color,#62789d);padding:8px 0 0}
  .metric-callout span{display:block;color:var(--mut);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em}
  .metric-callout b{display:block;font-size:18px;margin-top:2px}
  .metric-callout small{display:block;color:var(--mut);font-size:10px;margin-top:2px}
  .formula{font-family:var(--mono);font-size:11px;color:#34425b;background:#f5f7fa;border:1px solid var(--line);padding:8px 10px;margin:9px 0}
  .compact-details{margin:14px 0 0;border-top:1px solid var(--line);padding-top:10px}
  .compact-details summary{cursor:pointer;font-weight:650;color:#4f5b70;font-size:11.5px}
  .compact-details p{color:var(--mut);font-size:11px;margin:9px 0 0}
  .coverage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:8px 0}
  .coverage-grid div{padding:8px 0;border-bottom:1px solid var(--line)}
  .coverage-grid b{display:block;font-size:16px}.coverage-grid span{font-size:10px;color:var(--mut)}

const unitLoads=new Map();
function loadUnit(id,cb){
  if(window.UNIT_CACHE[id])return cb(window.UNIT_CACHE[id]);
  if(unitLoads.has(id)){unitLoads.get(id).push(cb);return;}
  unitLoads.set(id,[cb]);
  const finish=data=>{const callbacks=unitLoads.get(id);unitLoads.delete(id);callbacks.forEach(callback=>callback(data));};
  const attempt=number=>{
    const sc=document.createElement('script');let settled=false;
    sc.src='data/units/u'+id+'.js'+(number?'?retry='+Date.now():'');
    const complete=data=>{
      if(settled)return;settled=true;clearTimeout(timer);sc.onload=sc.onerror=null;sc.remove();
      if(data){finish(data);return;}
      if(!number){setTimeout(()=>attempt(1),250);return;}
      console.warn('Could not load unit data:',sc.src);finish(null);
    };
    const timer=setTimeout(()=>complete(null),20000);
    sc.onload=()=>complete(window.UNIT_CACHE[id]||null);
    sc.onerror=()=>complete(null);document.head.appendChild(sc);
  };

}

  return `rgb(${Math.round(lerp(a[0],b[0],f))},${Math.round(lerp(a[1],b[1],f))},${Math.round(lerp(a[2],b[2],f))})`;}
function colorRamp(colors,t){t=Math.max(0,Math.min(1,t));
  const x=t*(colors.length-1),i=Math.floor(x),f=x-i,a=colors[i],b=colors[Math.min(colors.length-1,i+1)];
  return `rgb(${Math.round(lerp(a[0],b[0],f))},${Math.round(lerp(a[1],b[1],f))},${Math.round(lerp(a[2],b[2],f))})`;}

function pdAvgTraj(data,idxList){
  if(!idxList.length)return [];
  const T=data[0].length,D=data[0][0].length;
  const out=Array.from({length:T},()=>new Array(D).fill(0));
  idxList.forEach(ti=>{for(let t=0;t<T;t++)for(let d=0;d<D;d++)out[t][d]+=data[ti][t][d];});
  for(let t=0;t<T;t++)for(let d=0;d<D;d++)out[t][d]/=idxList.length;
  return out;
}
function pdComponentRange(trajs,dims){
  let lo=Infinity,hi=-Infinity;
  trajs.forEach(tr=>tr.forEach(row=>dims.forEach(d=>{if(row[d]!=null){lo=Math.min(lo,row[d]);hi=Math.max(hi,row[d]);}})));
  if(!isFinite(lo)||!isFinite(hi))return [-1,1];
  const pad=(hi-lo)*.1||1;return [lo-pad,hi+pad];
}
function pdStateDistance(data,a,b){
  const ma=pdAvgTraj(data,a),mb=pdAvgTraj(data,b);
  return ma.map((row,t)=>Math.sqrt(row.reduce((sum,v,d)=>sum+(v-mb[t][d])*(v-mb[t][d]),0)));
}
function pdScalarAt(scal,key,trial,time,pawTax){
  if(!scal||!pawTax.length)return 0;
  const values=(key==='pos'?scal.pos:scal.vel)[trial];
  if(!values||!values.length)return 0;
  if(time<=pawTax[0])return values[0];
  if(time>=pawTax[pawTax.length-1])return values[values.length-1];
  let lo=0,hi=pawTax.length-1;
  while(hi-lo>1){const mid=(lo+hi)>>1;if(pawTax[mid]<=time)lo=mid;else hi=mid;}
  const f=(time-pawTax[lo])/((pawTax[hi]-pawTax[lo])||1);

}

function applyHash(){const p=new URLSearchParams(location.hash.slice(1));
  if(p.get('view')==='single-neuron-testing'){p.set('view','paperprep');p.set('ppfigure','figure3');history.replaceState(null,'','#'+p.toString());}
  const unit=p.get('unit')==null?null:+p.get('unit'),view=p.get('view');
  if(unit!=null&&UNITS[unit])state.sel=unit;
  if(view){if(view==='coact')history.replaceState(null,'','#view=interactions');state.view=view==='coact'?'interactions':view;state.sel=null;if(view==='contrib'&&unit!=null&&CASTLE.units[unit])state.inspectUnit=unit;}
  if(p.get('area'))state.area=p.get('area');if(p.get('group'))state.group=p.get('group');state.ver='77';
  if(p.get('cby'))state.latColor=p.get('cby');if(p.get('region'))state.region=p.get('region');
  if(p.get('figure'))state.paperFigure=p.get('figure');if(p.get('source'))state.paperSource=p.get('source');
  if(p.get('tfigure'))state.testingFigure=p.get('tfigure');if(p.get('tsource'))state.testingSource=p.get('tsource');
  if(p.get('ltrial')!=null)state.latTrial=p.get('ltrial');
  if(p.get('ppfigure'))state.prepFigure=p.get('ppfigure');}
function boot(){if(!UNITS.length){$('#main').innerHTML='<div class="card">No data. Run the generators.</div>';return;}
  if(window.createProfessorViews)PROFVIEW=window.createProfessorViews({h,s,stext,svgEl,lineChart,legend,groupedBars,matrixKey,showTip,hideTip,on,vividTime,vividDiverging,AC,GRPCOL,POP,PROF,ANALYSIS,state,render});
  if(window.createFigureReconstruction)FIGURES=window.createFigureReconstruction({h,s,stext,svgEl,axes,legend,scatterChart,popHeatmap,showTip,on,AC,CC,UNITS,POP,FIG12,selectUnit});
  if(window.createFigureReconstructionSecondDraft)SECOND_DRAFT_VIEWS=window.createFigureReconstructionSecondDraft({h,s,stext,svgEl,axes,legend,showTip,on,AC,UNITS,SECOND_DRAFT});
  if(window.createFigureReconstructionThirdDraft)THIRD_DRAFT_VIEWS=window.createFigureReconstructionThirdDraft({h,s,stext,svgEl,axes,legend,showTip,on,AC,UNITS,THIRD_DRAFT});
  if(window.createFunctionalHierarchy)HIERARCHY=window.createFunctionalHierarchy({h,s,stext,svgEl,axes,showTip,moveTip,hideTip,AC,UNITS,POP,HIER,selectUnit});
  if(window.createAdvancedViews)ADVANCED=window.createAdvancedViews({h,s,stext,svgEl,axes,lineChart,legend,groupedBars,areaChip,showTip,moveTip,hideTip,on,tks,fmt,median,viridis,vividDiverging,AC,FC,CELL_COLOR,UNITS,POP,CASTLE,ANALYSIS,state,loadUnit,selectUnit,go,render});
  if(window.createPopulationStateAtlas)ATLAS_VIEWS=window.createPopulationStateAtlas({h,s,stext,svgEl,showTip,on,state,render,selectUnit,UNITS,AC});
  const paperDashboard=host=>{const saved=state.sel;state.sel=state.inspectUnit;renderDashboard(host);state.sel=saved;};
  if(window.createFigureReconstructionPaper)PAPER_VIEWS=window.createFigureReconstructionPaper({h,state,views:{overview:vOverview,table:vTable,dashboard:paperDashboard,firing:vFiring,waveform:vWaveform,functional:vFunctional,corr:vCorr,hierarchy:HIERARCHY&&HIERARCHY.vHierarchy,rasters:vRasters,interactions:vInteractions,latent:vLatent,castle:ADVANCED&&ADVANCED.vCastle,contrib:ADVANCED&&ADVANCED.vContrib,atlas:ATLAS_VIEWS&&ATLAS_VIEWS.vAtlas}});
  if(window.createTestingViews)TESTING_VIEWS=window.createTestingViews({h,s,stext,svgEl,axes,state,UNITS,THIRD_DRAFT,CASTLE,TESTING_BEHAVIOR,REFPOP,PROF,AC,views:{thirdDraft:THIRD_DRAFT_VIEWS&&THIRD_DRAFT_VIEWS.vFigure2,interactions:vInteractions,latent:vLatent,castle:ADVANCED&&ADVANCED.vCastle,contrib:ADVANCED&&ADVANCED.vContrib,hierarchy:HIERARCHY&&HIERARCHY.vHierarchy,atlas:ATLAS_VIEWS&&ATLAS_VIEWS.vAtlas}});
  if(window.createPaperPreparationViews)PAPER_PREPARATION_VIEWS=window.createPaperPreparationViews({h,state});
  const fullSpikes=window.SPIKE_PROVENANCE?.completeBrowserEvents;
  $('#foot').textContent=`${UNITS.length} units · 80 trials · ${fullSpikes?fullSpikes.toLocaleString()+' complete-window spikes':'spike source pending'} · pop data ${POP.heatmap?'loaded':'—'}`;
  applyHash();window.addEventListener('hashchange',()=>{applyHash();render();});render();}
boot();
</script>
